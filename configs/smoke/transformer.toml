[data]
dataset_path = "tests/fixtures/tiny_corpus.txt"
tokenizer_type = "character"

[model]
context_length = 16
embedding_dim = 32
num_heads = 2
num_layers = 2
dropout = 0.0

[training]
random_seed = 42
batch_size = 4
learning_rate = 0.001
training_steps = 20
eval_interval = 5
eval_batches = 2
checkpoint_interval = 10
output_dir = "artifacts/smoke/transformer"
numerical_backend = "torch"
num_threads = 1

[generation]
temperature = 0.9
top_k = 5
generation_length = 60
